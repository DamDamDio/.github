name: Technical ticket
description: One repository's part of one story; its pull requests close it.
labels: ['kind:task']
projects: ['DamDamDio/1']
body:
  - type: markdown
    attributes:
      value: |
        One repository's part of one story: a story holds at most one per repository it touches, and each pull
        request links to one technical ticket. Triage sets the project's fields (Status, Phase, the estimates), but
        no Priority: a technical ticket inherits its story's. Never put a secret in an issue: issues are exported to
        git (admin-platform's ADR 0020).
  - type: input
    id: story
    attributes:
      label: Story
      description: "owner/repository#N of its story. Leave it empty only for an idea, which triage labels kind:idea; a Renovate update or a documentation-only change needs no ticket at all."
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true once this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The files, folders or services it touches.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer checks it, for example the gate's output, a command and its answer, a page.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Spec sections, ADRs, pull requests and issues (owner/repository#N).
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      description: Agent work to done, two review rounds included, as a relative size; a range as its upper bound.
      options:
        - low
        - medium
        - high
  - type: input
    id: owner-minutes
    attributes:
      label: Owner minutes
      description: The owner's attention it needs.
  - type: dropdown
    id: presence
    attributes:
      label: Owner presence
      description: >-
        What the owner must give while it runs. "none needed": it runs while the owner is away, and triage sets
        the project field to "none". GitHub's own "None" means not answered yet.
      options:
        - none needed
        - phone
        - hands-on
